name: release

# Build release binaries for Linux, macOS (arm64), and Windows.
# Pushing a tag like v0.1.0 builds all targets and attaches them to a GitHub
# Release. workflow_dispatch lets you build the matrix on demand without a tag
# (no release is published in that case).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-rs (rustls' crypto provider) assembles with NASM on Windows.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          dist="stacks2099-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/stacks2099" "$dist/"
          cp README.md LICENSE "$dist/" 2>/dev/null || true
          # Archive the contents at the root (binary, README, LICENSE) so a
          # Homebrew formula can `bin.install "stacks2099"` directly.
          tar czf "$dist.tar.gz" -C "$dist" .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist="stacks2099-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/stacks2099.exe" "$dist/"
          cp README.md LICENSE "$dist/" 2>/dev/null || true
          7z a "$dist.zip" "$dist"

      - uses: actions/upload-artifact@v4
        with:
          name: stacks2099-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Tags containing -dev. (e.g. v0.1.0-dev.1) publish as prereleases.
          prerelease: ${{ contains(github.ref_name, '-dev.') }}
          generate_release_notes: true
