[workspace]
members = [".", "tests/test_plugin"]

[package]
name = "stacks2099"
version = "0.5.0"
edition = "2021"
rust-version = "1.93.1"
description = "Server-projected terminal + notes workspace in a single Nushell-powered binary."
license = "MIT"
repository = "https://github.com/cablehead/stacks2099"
homepage = "https://github.com/cablehead/stacks2099"
keywords = ["terminal", "nushell", "datastar", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "stacks2099"
path = "src/main.rs"

[dependencies]
# The engine lives upstream. stacks2099 is a thin binary on top: it adds the
# pty command surface (src/pty.rs), the /pty/input fast-path, and the bundled
# app.
http-nu = "0.17.1"

clap = { version = "4", features = ["derive"] }
include_dir = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-serde = "2.1.1"

http = "1.1.0"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "server-auto"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "compat"] }
futures-util = "0.3"

bytes = "1.6.0"
url = "2.5.0"

# Pinned to the same engine http-nu bundles (0.113.1). Only the crates main.rs
# and pty.rs touch directly remain; the vendored engine's nu-parser /
# nu-cmd-* / nu-plugin-engine deps went with it.
nu-cli = "0.113.1"
nu-command = { version = "0.113.1", features = ["sqlite"] }
nu-engine = "0.113.1"
nu-path = "0.113.1"
nu-protocol = { version = "0.113.1", features = ["plugin"] }
ctrlc = "3.4"
arc-swap = "1.7"
rustls = { version = "0.23.28", features = ["aws_lc_rs"] }
rustls-pemfile = "2.1.0"
tokio-rustls = "0.26.0"
scru128 = { version = "3", features = ["serde"] }
miette = "7"
crossterm = "0.29"
chrono = "0.4"
ipnet = "2"
tower-http = { version = "0.6.6", features = ["fs"] }
tower = { version = "0.5.2", features = ["util"] }
brotli = "8"
http_encoding_headers = "0.2.0"
headers = "0.4.1"
minijinja = { version = "2", features = ["json", "urlencode", "loop_controls", "loader"] }
v_htmlescape = "0.15"
nu-std = { version = "0.113.1", features = ["sqlite"] }
nu-utils = "0.113.1"
typetag = "0.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
syntect = "5.3.0"
syntect-assets = "0.23.6"
pulldown-cmark = "0.12.2"
notify = "8"
portable-pty = "0.9"
base64 = "0.22"
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
# Pinned to the same rev as wezterm-term: provides hyperlink::Rule for
# implicit URL detection (wezterm-term re-exports Line but not the rules).
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }

[dependencies.cross-stream]
version = "0.13.2"
optional = true

[features]
default = ["cross-stream"]

[target.'cfg(unix)'.dependencies]
# Only used by the embedded-REPL signal dance (pty open --embedded), which is
# itself #[cfg(unix)]. nix is unix-only, so gate the dep to keep Windows builds
# (which exclude that code) compiling.
nix = { version = "0.30", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
win_uds = "=0.2.2"

[build-dependencies]
syntect = "5.3.0"
cargo_metadata = "0.18"


[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.10.1"
assert_cmd = "2.0"
predicates = "3"
nix = { version = "0.30", features = ["signal", "process"] }
sysinfo = "0.30.12"
brotli = "8"
minijinja = "2"





