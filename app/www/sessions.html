<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>{{ title or "ghostty-web-nu sessions" }}</title>
  <script type="module" src="{{ datastar_js_path }}"></script>
  <script type="module" src="/key-buffer.js"></script>
  <link rel="stylesheet" href="/stellar.css">
  <link rel="stylesheet" href="/md.css">
  <link rel="stylesheet" href="/grid.css">
  <style>
    :root {
      --bg: #1d0e2e; --fg: #d4d4d4;
      --pane: #161616; --pane-border: #2a2a2a;
      --sel: #2a9d4a; --sel-blur: #2d4f7c; --sel-fg: #ffffff; --dim: #888;
      --chrome: #252525;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px var(--term-font); }
    /* Top row holds sidebar | main | canvas; the bottom row is the status bar
       spanning all three columns (full window width). */
    body { display: grid; grid-template-columns: 14rem 16rem 1fr auto; grid-template-rows: 1fr auto; height: 100dvh; }
    /* niri reclaims the screen: collapse the stacks + clips rails so the strip
       gets the full width. Navigation is Alt+J/K + the panning strip; Alt+L
       restores flow (and the rails). */
    body.nav-collapsed { grid-template-columns: 0 0 1fr auto; }
    body.nav-collapsed > #stacks-list, body.nav-collapsed > #clips-list { overflow: hidden; }
    aside { background: var(--pane); border-right: 1px solid var(--pane-border); overflow-y: auto; min-height: 0; }
    aside header { padding: .4rem .5rem .4rem .75rem; border-bottom: 1px solid var(--pane-border); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; justify-content: space-between; }
    aside header .new-btn { background: transparent; color: inherit; border: 1px solid var(--pane-border); border-radius: 3px; padding: 0 .5rem; font: inherit; cursor: pointer; line-height: 1.4; }
    aside header .sort-btn { margin-left: auto; margin-right: .4rem; background: transparent; color: var(--dim); border: 1px solid var(--pane-border); border-radius: 3px; padding: 0 .4rem; font: inherit; font-size: 11px; line-height: 1.4; text-transform: none; cursor: pointer; }
    aside header .sort-btn:hover { background: #222; color: var(--fg); }
    aside header .new-btn:hover { background: #222; color: var(--fg); }
    aside ul { list-style: none; margin: 0; padding: 0; }
    aside li { display: flex; align-items: stretch; border-bottom: 1px solid var(--pane-border); }
    aside li .row { flex: 1; min-width: 0; text-align: left; background: transparent; color: inherit; border: 0; padding: .4rem .75rem; font: inherit; cursor: pointer; overflow: hidden; }
    aside li .row:hover { background: #222; }
    /* Selected tab is blue while merely selected (navigate mode) and green
       once a terminal is focused -- mirrors the focused/blurred distinction. */
    aside li.selected .row { background: var(--sel-blur); color: var(--sel-fg); }
    body.mode-focus aside li.selected .row { background: var(--sel); }
    aside li .close { flex: 0 0 auto; width: 1.75rem; background: transparent; color: inherit; border: 0; padding: 0; font: inherit; cursor: pointer; opacity: 0; transition: opacity .1s; }
    aside li:hover .close, aside li.selected .close { opacity: .6; }
    aside li .close:hover { opacity: 1; color: #ff7676; background: #222; }
    aside li .copy { flex: 0 0 auto; width: 1.75rem; display: flex; align-items: center; justify-content: center; background: transparent; color: inherit; border: 0; padding: 0; font: inherit; cursor: pointer; opacity: 0; transition: opacity .1s; }
    aside li:hover .copy, aside li.selected .copy { opacity: .6; }
    aside li .copy:hover { opacity: 1; background: #222; }
    aside li .copy.copied { opacity: 1; color: var(--sel); }
    aside li small { display: block; font-size: 11px; opacity: .6; }
    /* Inline SVG icons (vendored lucide). Size to the text, nudge to the
       baseline, and leave a little space before the label. */
    .row-icon, .picker-row .icon { width: 1em; height: 1em; vertical-align: -0.15em; margin-right: .5ch; flex: 0 0 auto; }
    /* main is a grid: topbar | doc. The status bar lives at body level now. */
    main { display: grid; grid-template-rows: auto 1fr; min-height: 0; overflow: hidden; }
    .topbar {
      background: var(--chrome); padding: .15rem .75rem;
      display: flex; align-items: center;
      font-size: 11px; color: var(--dim);
    }
    .title-display { cursor: pointer; padding: 0 .25rem; border-radius: 2px; }
    .title-display:hover { background: #2f2f2f; color: var(--fg); }
    .middle { display: grid; grid-template-columns: 1fr 1ch; min-height: 0; }
    /* Continuous document: every session's terminal stacked vertically, the
       whole column scrolls. Each .pane is a fixed-height live terminal whose
       grid.css #screen-<sid> fills the .pane-screen below its header. */
    #doc { min-height: 0; overflow-y: auto; overflow-x: hidden; padding: .5rem; display: flex; flex-direction: column; gap: .5rem; }
    /* niri layout: the document becomes a horizontal scrollable strip -- each
       pane a fixed-width (80ch) full-height column you pan across, rather than a
       stacked row. Same panes (live grids intact), only the container axis flips. */
    #doc.layout-niri { flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: stretch; }
    #doc.layout-niri .pane { flex: 0 0 80ch; width: 80ch; overflow-y: auto; }
    .pane { flex: 0 0 auto; display: flex; flex-direction: column; border: 1px solid var(--pane-border); border-radius: 4px; overflow: hidden; background: var(--term-bg); transition: opacity .12s, border-color .12s; scroll-margin: .5rem; }
    .pane-head { flex: 0 0 auto; padding: .15rem .6rem; font-size: 11px; color: var(--dim); background: var(--chrome); cursor: pointer; display: flex; gap: .5ch; align-items: baseline; }
    .pane-head small { opacity: .5; }
    /* Morph HUD: rows touched by the last /pty/view patch. Pushed to the right
       end of the head so it doesn't crowd the label; tabular-nums keeps it
       from jittering as the digit count changes. */
    .pane-head .grid-hud { margin-left: auto; opacity: .55; font-variant-numeric: tabular-nums; }
    /* The terminal viewport. terminal.js sets its height to the row count it
       wants (fixedRows * cell height), so the pane sizes itself -- no calc,
       no absolute positioning. Scrollback scrolls within this box. */
    .pane-screen { flex: 0 0 auto; overflow-y: auto; overflow-x: hidden; background: var(--term-bg); }
    /* Note panes: a <pre> for display, swapped for a <textarea> while editing.
       Both share the terminal font and the pane background (no white box, no
       border) so editing blends into the surface. The editor fills the pane
       width and grows with its content (JS sets height from scrollHeight),
       with a few-row floor so a new note has room. */
    .note-body { background: var(--term-bg); }
    .note-pre, .note-edit {
      display: block; width: 100%; box-sizing: border-box; margin: 0;
      padding: .25rem .6rem;
      background: var(--term-bg); color: var(--term-fg);
      font-family: var(--term-font); font-size: 14px; line-height: var(--cell-h);
      white-space: pre-wrap; word-break: break-word;
      min-height: calc(var(--cell-h) * 3);
    }
    .note-edit { border: 0; outline: none; resize: none; overflow: hidden; }
    /* Content previews: images, read-only text, file links. */
    .clip-media { padding: .4rem .6rem; background: var(--term-bg); }
    .clip-img { display: block; max-width: 100%; height: auto; border-radius: 3px; }
    .clip-file { color: var(--sel-fg); }
    .clip-pre {
      margin: 0; padding: .25rem .6rem; background: var(--term-bg); color: var(--term-fg);
      font-family: var(--term-font); font-size: 14px; line-height: var(--cell-h);
      white-space: pre-wrap; word-break: break-word; max-height: 30rem; overflow: auto;
    }
    /* Embed (live iframe) clips. */
    .clip-embed-wrap { display: flex; flex-direction: column; background: var(--term-bg); }
    .embed-bar { display: flex; gap: .5ch; align-items: center; padding: .2rem .5rem; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--pane-border); }
    .embed-url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); text-decoration: none; }
    .embed-url:hover { color: var(--fg); }
    .clip-embed { width: 100%; height: 40rem; border: 0; background: #fff; }
    .mini-btn { background: transparent; color: var(--dim); border: 1px solid var(--pane-border); border-radius: 3px; padding: 0 .5ch; font: inherit; font-size: 11px; cursor: pointer; }
    .mini-btn:hover { background: #222; color: var(--fg); }
    .note-actions { padding: .25rem .6rem; }
    /* The active (selected) pane is highlighted. In navigate mode every pane
       is dimmed (read-only); focus mode lights the active one fully. */
    .pane.active { border-color: var(--sel-blur); }
    body.mode-focus .pane.active { border-color: var(--sel); }
    body.mode-navigate .pane { opacity: .3; }
    body.mode-navigate .pane.active { opacity: .55; }
    body.mode-focus .pane { opacity: .4; }
    body.mode-focus .pane.active { opacity: 1; }
    .mode-badge { margin-left: auto; font-size: 11px; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; }
    body.mode-focus .mode-badge { color: var(--sel); }
    .rightbar { background: var(--chrome); }
    .statusbar {
      grid-column: 1 / -1; /* span sidebar + main + canvas */
      display: flex; justify-content: space-between; align-items: center;
      padding: .4rem 1rem;
      background: var(--chrome); color: var(--fg);
      border-top: 1px solid var(--pane-border);
      font-size: 11px; line-height: 1;
      font-family: var(--term-font);
    }
    .status-keys { display: flex; gap: .75rem; align-items: center; }
    .status-mode { text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
    body.mode-focus .status-mode { color: var(--sel); }
    #status-bindings { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .statusbar .binding { display: inline-flex; gap: .4ch; align-items: center; cursor: pointer; opacity: .75; }
    .statusbar .binding:hover { opacity: 1; }
    .statusbar .binding kbd {
      font-family: var(--term-font); font-size: 10px;
      background: #1c1c1c; border: 1px solid var(--pane-border);
      border-radius: 3px; padding: 0 .4ch; line-height: 1.4;
    }
    .status-meta { display: flex; gap: 1rem; align-items: center; }
    /* Right-side canvas pane. Lives in body's third grid column (`auto`), so
       when :empty the column collapses to 0 and the terminal gets full width.
       Server pushes content via the same /sse stream (canvas.events). */
    .canvas {
      position: relative;
      width: var(--canvas-w, 32rem); min-height: 0; overflow: auto;
      background: var(--pane); border-left: 1px solid var(--pane-border);
      padding: .75rem; box-sizing: border-box;
      font-size: 12px;
    }
    .canvas:empty { display: none; }
    .canvas pre { margin: 0; white-space: pre; }
    .canvas-resizer {
      position: absolute; left: -3px; top: 0; bottom: 0; width: 6px;
      cursor: col-resize; background: transparent;
      transition: background .15s;
    }
    .canvas-resizer:hover, body.canvas-dragging .canvas-resizer { background: var(--sel); }
    .canvas-content { height: 100%; }
    body.canvas-dragging { user-select: none; cursor: col-resize; }
    body.canvas-dragging .term-wrap, body.canvas-dragging .canvas-content { pointer-events: none; }

    /* Rename modal. */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.45);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 6rem;
    }
    .modal-box {
      width: min(28rem, 90%);
      background: var(--pane);
      border: 1px solid var(--pane-border);
      border-radius: 4px;
      padding: .75rem 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .modal-heading {
      font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--dim); margin-bottom: .35rem;
    }
    .modal-input {
      width: 100%; background: transparent; border: 0; outline: none;
      color: var(--fg); font: inherit; font-size: 14px;
      padding: .25rem 0;
    }

    /* New-clip picker. A cross-clip concept, so it descends from the top bar
       (top-right), not the bottom status bar. The panel shares the bar's
       --chrome colour and rounds only its bottom corners, so it reads as
       extending out of the bar. We will grow this bar toward ~/stacks. */
    .picker-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: flex-start; justify-content: flex-end;
      padding: 1.5rem .75rem 0 0;
      background: transparent;
    }
    .picker-panel {
      min-width: 13rem;
      background: var(--chrome);
      border: 1px solid var(--pane-border);
      border-top: 0;
      border-radius: 0 0 5px 5px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    .picker-heading {
      padding: .3rem .75rem;
      font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--dim); border-bottom: 1px solid var(--pane-border);
    }
    .picker-row {
      display: flex; align-items: center; width: 100%;
      text-align: left; background: transparent; color: var(--fg);
      border: 0; padding: .4rem .75rem; font: inherit; cursor: pointer;
    }
    /* Keyboard (.sel) and mouse (:hover) share one highlight. */
    .picker-row:hover, .picker-row.sel { background: var(--sel-blur); color: var(--sel-fg); }

    /* Clip-actions panel. Acts on the current clip, so it rises out of the
       bottom-right status bar (rounded top corners, shadow upward) -- the
       mirror of the top New picker. Reuses .picker-row / .picker-heading. */
    .actions-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: flex-end; justify-content: flex-end;
      padding: 0 .75rem 2.2rem 0;
      background: transparent;
    }
    .actions-panel {
      min-width: 13rem;
      background: var(--chrome);
      border: 1px solid var(--pane-border);
      border-bottom: 0;
      border-radius: 5px 5px 0 0;
      box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
  </style>
</head>
<body
  data-signals='{"selectedSid":"","selectedStack":"","connId":"","sid":"","sel":"","termCols":0,"termRows":0,"termTitle":"","focusedDims":"","title":{{ title | default("") | tojson | e }},"docReady":false,"picking":false,"acting":false,"renaming":false,"renameMode":"title","renameStackId":"","draft":"","label":"","noteEditing":"","docOrder":"[]","docLayout":"flow"}'
  data-init="@get('/sse')"
  data-effect="document.title = $title || 'ghostty-web-nu sessions'"
  data-class:nav-collapsed="$docLayout === 'niri'"
  data-actions='{
    "new":       "window.app.newSession()",
    "close":     "window.app.closeSelected()",
    "next":      "window.app.cycle(1)",
    "prev":      "window.app.cycle(-1)",
    "moveDown":  "window.app.move(\"down\")",
    "moveUp":    "window.app.move(\"up\")",
    "toggleSort":"window.app.toggleSort()",
    "toggleLayout":"window.app.toggleLayout()",
    "rename":    "window.app.openRename()",
    "renameTab": "window.app.openRenameTab()",
    "cycleHeight":"window.app.cycleHeight()"
  }'
  data-keymap='{
    "alt+t": "new",
    "alt+d": "close",
    "alt+j": "next",
    "alt+k": "prev",
    "alt+shift+j": "moveDown",
    "alt+shift+k": "moveUp",
    "alt+s": "toggleSort",
    "alt+l": "toggleLayout",
    "alt+r": "renameTab",
    "alt+shift+r": "rename",
    "alt+o": "cycleHeight"
  }'
>
  <!-- Three-pane: stacks | clips | content (#doc). Server overwrites the two
       asides on every event. -->
  <aside id="stacks-list"><header>Stacks</header></aside>
  <aside id="clips-list"><header>Clips</header></aside>

  <main>
    <div class="topbar">
      <span
        class="title-display"
        title="Rename (Alt+Shift+R)"
        data-text="$title || 'untitled'"
        data-on:click="$draft = $title; $renameMode = 'title'; $renaming = true"></span>
    </div>
    <!-- Continuous document of session panes. The server fills #doc on init
         and appends/removes panes as sessions come and go; each pane opens
         its own view stream and mounts terminal.js. Selection highlight is
         reactive via data-class on $selectedSid. -->
    <div id="doc" class="doc"></div>
  </main>

  <!-- Scroll the active pane into view (stacks-style offset) whenever the
       selection changes. Lives in the static shell so the server never
       morphs it away; data-effect fires on $selectedSid change. -->
  <!-- Lead with a bare $selectedSid read so Datastar registers it as a
       dependency even on the first eval, when the deferred module hasn't
       defined window.__onSelect yet (a `&&` guard would short-circuit
       before $selectedSid is read, and the effect would never re-run). -->
  <div data-effect="$selectedSid; window.__onSelect && window.__onSelect($selectedSid)" style="display:none"></div>
  <!-- Mirror the selected stack id to JS so the (non-datastar) paste handler
       can target the current stack when adding an image clip. -->
  <div data-effect="window.__selectedStack = $selectedStack" style="display:none"></div>
  <!-- Apply the server's docOrder by relocating existing #doc panes (moving a
       DOM node preserves its live terminal grid + stream). -->
  <div data-effect="$docOrder; window.__applyDocOrder && window.__applyDocOrder($docOrder)" style="display:none"></div>
  <!-- Layout flip: resize terminals to fill (niri) or constant rows (flow).
       Lead with a bare $docLayout read so datastar registers it as a dependency
       on first eval (the `&&` would short-circuit before re-reading it). -->
  <div data-effect="$docLayout; window.__applyLayout && window.__applyLayout($docLayout)" style="display:none"></div>
  <!-- Patch the picker's key handler in and out on the $picking edge. The
       picker node is static (toggled by data-show), so this stands in for the
       morph-driven mount/self-clean that an action panel gets for free. Lead
       with a bare $picking read so datastar registers the dependency even
       before the deferred module defines __syncPicker. -->
  <div data-effect="$picking; window.__syncPicker && window.__syncPicker($picking)" style="display:none"></div>
  <!-- Same edge-patch for the clip-actions panel ($acting). -->
  <div data-effect="$acting; window.__syncActions && window.__syncActions($acting)" style="display:none"></div>

  <!-- Server-pushed canvas pane. Empty -> collapses to 0 width. -->
  <section id="canvas" class="canvas"></section>

  <!-- Status bar spans the full width of the window's bottom (under the
       sidebar and canvas too), so it is a body-level row, not nested in main.
       Modal: the active mode's name + its clickable key bindings (filled by JS
       on setMode); clicking a binding fires the same action a keypress would. -->
  <footer class="statusbar" aria-label="Status">
    <span class="status-keys"><span class="status-mode" id="status-mode">navigate</span><span id="status-bindings"></span></span>
    <span class="status-meta">
      <span data-text="$focusedDims"></span>
      <span data-text="$selectedSid ? ('sid ' + $selectedSid.slice(0,8)) : ''" style="opacity:.5;"></span>
    </span>
  </footer>

  <!-- Hidden trigger so the JS-only Alt+R action can seed signals through
       datastar's expression evaluator. `$label` is kept in sync server-side
       with the selected clip's display label (label-of in serve.nu); the
       click just copies that into the rename modal's draft input. -->
  <button
    id="rename-tab-trigger"
    type="button"
    hidden
    data-on:click="$draft = $label; $renameMode = 'tab'; $renaming = true"></button>

  <!-- Rename modal. -->
  <div class="modal-backdrop" data-show="$renaming" data-on:click="$renaming = false">
    <div class="modal-box" data-on:click="evt.stopPropagation()">
      <div class="modal-heading" data-text="$renameMode === 'tab' ? 'Rename clip' : ($renameMode === 'stack' ? 'Rename stack' : 'Rename window')"></div>
      <input
        type="text"
        class="modal-input"
        spellcheck="false"
        aria-label="rename"
        data-bind="draft"
        data-effect="$renaming && requestAnimationFrame(() => { el.focus(); el.setSelectionRange(0, el.value.length); })"
        data-on:keydown="if (evt.key === 'Enter') { if ($renameMode === 'tab') { $label = $draft; $renaming = false; @post('/pty/label') } else if ($renameMode === 'stack') { $renaming = false; @post('/stack/rename') } else { $title = $draft; $renaming = false; @post('/title') } } else if (evt.key === 'Escape') { $renaming = false }">
    </div>
  </div>

  <!-- New-clip type picker (Alt+T / the + button). A cross-clip concept, so it
       drops from the top bar (top-right), not the bottom status bar. Terminal
       spawns a pty clip; Note creates a CAS text clip you land in to edit.
       Keyboard quick-select is wired by __syncPicker on the $picking edge:
       Ctrl-n/Ctrl-p or Down/Up move, Enter chooses, Esc closes. -->
  <div class="picker-backdrop" data-show="$picking" data-on:click="$picking = false">
    <div class="picker-panel" data-on:click="evt.stopPropagation()">
      <div class="picker-heading">New clip</div>
      <button type="button" class="picker-row" data-on:click="$picking = false; @post('/clip/new?type=terminal')">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2"/></svg> Terminal
      </button>
      <button type="button" class="picker-row" data-on:click="$picking = false; @post('/clip/new?type=note')">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> Note
      </button>
    </div>
  </div>

  <!-- Clip-actions panel (mod+K in navigate mode / the Actions status binding).
       Acts on the current clip, so it rises from the bottom-right status bar.
       Rename and Close moved in here; both stay available as Alt+R / Alt+D too.
       Keyboard quick-select wired by __syncActions on the $acting edge. -->
  <div class="actions-backdrop" data-show="$acting" data-on:click="$acting = false">
    <div class="actions-panel" data-on:click="evt.stopPropagation()">
      <div class="picker-heading">Clip</div>
      <button type="button" class="picker-row" data-on:click="$acting = false; window.app.openRenameTab()">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg> Rename
      </button>
      <button type="button" class="picker-row" data-on:click="$acting = false; window.app.closeSelected()">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg> Close
      </button>
    </div>
  </div>

  <!-- key-buffer's sid is set imperatively by __focusClip to the focused
       terminal's pty sid (not the clip id), so no data-attr binding here. -->
  <key-buffer></key-buffer>

  <script type="module">
    import { ensureTermFont, mountTerminal } from './terminal.js';
    // mergePatch lets imperative code (focus/blur of the note editor) drive the
    // same signal store the data-* attributes read. Re-importing the bundle is
    // free -- ES modules are singletons, so this is the live store.
    import { mergePatch } from '{{ datastar_js_path | safe }}';
    await ensureTermFont();

    // Restore the canvas width set by the last drag.
    {
      const w = localStorage.getItem('canvas-w');
      if (w) document.body.style.setProperty('--canvas-w', w);
    }

    const doc = document.getElementById('doc');
    const PANE_ROWS = 24;
    // Current stack layout (mirrors the $docLayout signal). In flow each
    // terminal is a constant PANE_ROWS tall; in niri its column is full-height,
    // so terminals fill it (fixedRows = null -> rows from available height).
    let currentLayout = 'flow';
    const layoutRows = () => (currentLayout === 'niri' ? null : PANE_ROWS);

    // Panes are keyed by clip id. Terminal panes mount terminal.js on their
    // live grid; note panes wire textarea<->pre editing. Both happen as the
    // server appends panes; terminal handles are torn down on removal.
    const mounted = new Map(); // clip id -> terminal handle
    function mountTerminalPane(pane) {
      const cid = pane.dataset.clip;
      if (!cid || mounted.has(cid)) return;
      const screen = pane.querySelector('.pane-screen');
      const grid = pane.querySelector('[id^="grid-"]');
      if (!screen || !grid) return; // [exited] placeholder has no grid
      const sid = screen.dataset.sid;
      const term = mountTerminal({
        screen,
        grid,
        fixedRows: layoutRows(),
        onResize: (cols, rows) => {
          if (!sid) return;
          fetch('/pty/resize?sid=' + encodeURIComponent(sid), {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ cols, rows }),
          }).catch(() => {});
        },
      });
      mounted.set(cid, term);
      term.syncNow();
    }
    // Size a note editor to its content height (CSS min-height is the floor).
    function growNote(ta) {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }
    function wireNotePane(pane) {
      // Mark via a JS property, not a data-* attribute: note panes re-render
      // live now, and a morph would strip a marker attribute (the server
      // doesn't emit it), re-wiring duplicate listeners on the next scan. A
      // property rides along with the preserved node and the morph leaves it.
      if (pane.__noteWired) return;
      pane.__noteWired = true;
      const cid = pane.dataset.clip;
      const pre = pane.querySelector('.note-pre');
      const ta = pane.querySelector('.note-edit');
      if (!ta) return;
      // Blur ends editing: clear $noteEditing (data-show reveals the <pre>),
      // hide the editor, and persist (clip.update -> CAS). The <pre> text is
      // mirrored optimistically so it doesn't flash the old body before the
      // clip.update echo morphs it. The <pre>'s visibility is reactive, so we
      // never touch its display here.
      ta.addEventListener('blur', () => {
        mergePatch({ noteEditing: '' });
        ta.style.display = 'none';
        pre.textContent = ta.value;
        fetch('/clip/update?clip=' + encodeURIComponent(cid), {
          method: 'POST', headers: { 'content-type': 'text/plain' }, body: ta.value,
        }).catch(() => {});
      });
      // Grow the editor to fit its content so there is no inner scrollbar --
      // the note flows with the document. __focusClip sizes it on show too.
      ta.addEventListener('input', () => growNote(ta));
      // Focus == editing this note: flag it so the <pre> hides reactively and
      // a live morph leaves this clip's draft alone. Focus fires after the
      // previous element's blur, so switching between notes resolves to the
      // clip being entered, not the one being left.
      ta.addEventListener('focus', () => { mergePatch({ noteEditing: cid }); });
      // A freshly created note arrives empty -- focus it (== edit it) straight
      // away. __onSelect would do this too, but only in focus mode and only
      // once $selectedSid arrives, which can race the pane's DOM append; the
      // empty-body case is handled here deterministically on first wire. A
      // reloaded note has a body, so it stays in display mode until selected.
      if (ta.value === '') window.__focusClip(cid);
    }
    function scanPanes() {
      doc.querySelectorAll('.pane').forEach((pane) => {
        // data-render: 'terminal' mounts the grid, 'note' wires the editor,
        // 'static' (image/file/html previews) needs no client mounting.
        if (pane.dataset.render === 'terminal') mountTerminalPane(pane);
        else if (pane.dataset.render === 'note') wireNotePane(pane);
      });
      for (const cid of [...mounted.keys()]) {
        if (!doc.querySelector('#pane-' + CSS.escape(cid))) mounted.delete(cid);
      }
    }
    new MutationObserver(scanPanes).observe(doc, { childList: true });
    scanPanes();

    // Sidebar copy-sid button (delegated; rows are re-rendered by datastar).
    document.addEventListener('click', (e) => {
      const btn = e.target instanceof HTMLElement ? e.target.closest('.copy') : null;
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const sid = btn.dataset.sid || '';
      if (!sid) return;
      navigator.clipboard?.writeText(sid).then(() => {
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 600);
      }).catch(() => {});
    });

    // Drag-to-resize the canvas pane (delegated; .canvas-resizer is
    // re-created on every #canvas patch).
    document.addEventListener('mousedown', (e) => {
      if (!(e.target instanceof HTMLElement) || !e.target.classList.contains('canvas-resizer')) return;
      e.preventDefault();
      document.body.classList.add('canvas-dragging');
      const onMove = (ev) => {
        const min = 12 * 16, maxTake = window.innerWidth - 24 * 16;
        const w = Math.max(min, Math.min(maxTake, window.innerWidth - ev.clientX));
        document.body.style.setProperty('--canvas-w', w + 'px');
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.body.classList.remove('canvas-dragging');
        const w = document.body.style.getPropertyValue('--canvas-w');
        if (w) localStorage.setItem('canvas-w', w);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    // Paste an image anywhere -> add it as an image clip in the current stack.
    // Only images are intercepted; text paste falls through to the terminal /
    // note editor as usual.
    window.addEventListener('paste', async (e) => {
      const item = [...(e.clipboardData?.items || [])].find((it) => it.type.startsWith('image/'));
      if (!item) return;
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) return;
      const buf = await file.arrayBuffer();
      const stack = window.__selectedStack || '';
      await fetch('/clip/add?mime_type=' + encodeURIComponent(file.type) + '&stack=' + encodeURIComponent(stack), {
        method: 'POST', headers: { 'content-type': file.type }, body: buf,
      }).catch(() => {});
    });

    // Action registry. data-actions maps id -> JS, data-keymap maps combo ->
    // id. The capture-phase handler below evaluates the matched action's JS.
    window.app = {
      newSession() {
        // The + button sets $picking; opens the note/terminal type picker.
        document.querySelector('#clips-list .new-btn')?.click();
      },
      closeSelected() {
        const cid = currentClip();
        if (!cid) return;
        fetch('/clip/close?clip=' + encodeURIComponent(cid), { method: 'POST' }).catch(() => {});
      },
      openActions() {
        // Bottom-right clip-actions panel (Rename / Close). mergePatch drives
        // the $acting signal the same way the rename trigger drives $renaming.
        mergePatch({ acting: true });
      },
      move(dir) {
        // Reorder the selected clip up/down within its stack (Alt+Shift+J/K).
        const cid = currentClip();
        if (!cid) return;
        const stack = window.__selectedStack || '';
        fetch('/clip/move?dir=' + dir + '&clip=' + encodeURIComponent(cid) + '&stack=' + encodeURIComponent(stack), { method: 'POST' }).catch(() => {});
      },
      toggleSort() {
        // Toggle the selected stack between auto (activity) and manual order.
        const stack = window.__selectedStack || '';
        if (!stack) return;
        fetch('/stack/sort?stack=' + encodeURIComponent(stack), { method: 'POST' }).catch(() => {});
      },
      toggleLayout() {
        // Toggle the selected stack between flow (column) and niri (strip).
        const stack = window.__selectedStack || '';
        if (!stack) return;
        fetch('/stack/layout?stack=' + encodeURIComponent(stack), { method: 'POST' }).catch(() => {});
      },
      cycle(dir) {
        const items = [...document.querySelectorAll('#clips-list li')];
        if (!items.length) return;
        const idx = items.findIndex((li) => li.classList.contains('selected'));
        const next = items[((idx < 0 ? 0 : idx) + dir + items.length) % items.length];
        next.querySelector('.row')?.click();
      },
      openRename() {
        document.querySelector('.title-display')?.click();
      },
      openRenameTab() {
        // The trigger button's `data-on:click` reads `$label` directly; we
        // just need to fire the synthetic click so datastar evaluates the
        // expression (it can only mutate signals from a real DOM event, not
        // from arbitrary JS like this).
        document.getElementById('rename-tab-trigger')?.click();
      },
      toggleFocus() {
        // mod+Enter symmetric toggle (the only focus entry/exit): leave focus
        // if focused (a note blurs and saves on the way out), otherwise focus
        // the selected clip.
        if (mode === 'focus') { setMode('navigate'); return; }
        const cid = currentClip();
        if (cid) window.__focusClip(cid);
      },
      cycleHeight() {
        // Cycle the active terminal pane's height (rows): default -> compact
        // -> 2/3 of the document -> full document -> default. terminal.js
        // resizes the pty to match. Width stays pane-driven; notes auto-grow,
        // so this is a terminal-only chord.
        const cid = currentClip();
        if (!cid) return;
        const term = mounted.get(cid);
        if (!term || !term.setFixedRows) return;
        const cellH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-h'), 10) || 17;
        const fullRows = Math.max(6, Math.floor(doc.clientHeight / cellH));
        const sizes = [PANE_ROWS, 8, Math.max(6, Math.floor(fullRows * 2 / 3)), fullRows];
        const next = ((heightIdx.get(cid) ?? 0) + 1) % sizes.length;
        heightIdx.set(cid, next);
        term.setFixedRows(sizes[next]);
      },
    };
    // Per-clip height-cycle index for cycleHeight().
    const heightIdx = new Map();

    // The selected clip id, read from the active pane (datastar sets .active
    // reactively from $selectedSid, which now holds the selected clip id).
    const currentClip = () => doc.querySelector('.pane.active')?.dataset.clip || '';

    // Reorder #doc panes to match the server's docOrder. appendChild moves an
    // existing node (keeping its live terminal grid + stream attached), so
    // reordering is non-destructive.
    window.__applyDocOrder = (json) => {
      let order;
      try { order = JSON.parse(json || '[]'); } catch { return; }
      for (const id of order) {
        const pane = doc.querySelector('#pane-' + CSS.escape(id));
        if (pane) doc.appendChild(pane);
      }
    };
    // Layout flip: in niri terminals fill their full-height column; in flow
    // they return to the constant PANE_ROWS document height. Re-apply to every
    // mounted terminal (newly-mounted ones pick it up via layoutRows()).
    //
    // Measure on the next frame, not now: the layout-niri class is a sibling
    // data-class reaction to the same $docLayout change, and its order versus
    // this data-effect isn't guaranteed. Measuring before it reflows the panes
    // to 80ch reads the old (flow) geometry, so the pty keeps the wider width
    // until a later ResizeObserver fires -- and a program like bat, reading the
    // winsize once at startup, draws to the stale too-wide size and overflows
    // the narrower niri column. rAF runs after the class is applied.
    window.__applyLayout = (layout) => {
      currentLayout = (layout === 'niri') ? 'niri' : 'flow';
      requestAnimationFrame(() => {
        for (const term of mounted.values()) term.setFixedRows?.(layoutRows());
      });
    };
    window.__onSelect = (cid) => {
      if (cid) {
        // Reveal the selected pane's bottom (a terminal's prompt sits there).
        const pane = doc.querySelector('#pane-' + CSS.escape(cid));
        if (pane) {
          // flow: reveal the pane's bottom (a terminal's prompt sits there).
          // niri: pan the strip so the focused column is centered.
          if (doc.classList.contains('layout-niri')) {
            pane.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
          } else {
            pane.scrollIntoView({ block: 'end', behavior: 'smooth' });
          }
          // Focus carries with the selection while in focus mode (so Alt+J/K
          // moves you from one focused pane straight into the next: a terminal
          // gets key-buffer/pty, a note opens its editor). Navigate mode is
          // read-only browsing, so it never auto-focuses.
          if (mode === 'focus') window.__focusClip(cid);
        }
      }
      if (mode === 'focus' && !cid) setMode('navigate');
    };

    // Modal interaction: navigate vs focus. In navigate mode the terminal is
    // greyed and key-buffer is off, so the app keymap (Alt+T/D/J/K/R/O) is live
    // and nothing leaks to the pty. mod+Enter focuses the selected terminal ->
    // key-buffer on, keys route to the pty (plain Esc and Enter included), and
    // mod+Enter returns to navigate.
    const keybuf = document.querySelector('key-buffer');

    // Modal status bar. Each mode lists its clickable key bindings in the
    // footer; clicking one runs the same action the key would. Keys are
    // ASCII labels (project convention) rather than glyphs.
    const statusMode = document.getElementById('status-mode');
    const statusBindings = document.getElementById('status-bindings');
    // App chords (Alt-prefixed) are global, so both modes list them. The
    // mod+Enter focus toggle is the only focus entry/exit. The mod key is Cmd
    // on macOS, Ctrl elsewhere -- both are mapped; the label follows the
    // platform.
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
    const modLabel = isMac ? 'Cmd' : 'Ctrl';
    const appChords = [
      { label: 'New', keys: ['Alt', 'T'], run: () => window.app.newSession() },
      { label: 'Close', keys: ['Alt', 'D'], run: () => window.app.closeSelected() },
      { label: 'Move', keys: ['Alt', 'Shift', 'J/K'], run: () => window.app.move('down') },
      { label: 'Sort', keys: ['Alt', 'S'], run: () => window.app.toggleSort() },
      { label: 'Layout', keys: ['Alt', 'L'], run: () => window.app.toggleLayout() },
      { label: 'Rename', keys: ['Alt', 'R'], run: () => window.app.openRenameTab() },
      { label: 'Height', keys: ['Alt', 'O'], run: () => window.app.cycleHeight() },
    ];
    const actionsBinding = { label: 'Actions', keys: [modLabel, 'K'], run: () => window.app.openActions() };
    const bindingsByMode = {
      navigate: [
        ...appChords,
        actionsBinding,
        { label: 'Focus', keys: [modLabel, 'Enter'], run: () => window.app.toggleFocus() },
      ],
      focus: [
        ...appChords,
        // Cmd+K works in focus mode (Meta never reaches the pty); Ctrl+K stays
        // kill-line, so only advertise Actions here when the mod is Cmd (macOS).
        ...(isMac ? [actionsBinding] : []),
        { label: 'Navigate', keys: [modLabel, 'Enter'], run: () => window.app.toggleFocus() },
      ],
    };
    function renderBindings(m) {
      statusMode.textContent = m;
      statusBindings.replaceChildren();
      for (const b of (bindingsByMode[m] || [])) {
        const el = document.createElement('span');
        el.className = 'binding';
        const lbl = document.createElement('span');
        lbl.textContent = b.label;
        el.appendChild(lbl);
        for (const k of b.keys) {
          const kbd = document.createElement('kbd');
          kbd.textContent = k;
          el.appendChild(kbd);
        }
        el.addEventListener('mousedown', (e) => { e.preventDefault(); b.run(); });
        statusBindings.appendChild(el);
      }
    }

    let mode = 'navigate';
    function setMode(m) {
      mode = m;
      document.body.classList.toggle('mode-focus', m === 'focus');
      document.body.classList.toggle('mode-navigate', m === 'navigate');
      // Leaving focus always silences key-buffer and ends any note edit (its
      // blur handler renders the <pre> and persists). Entering focus does NOT
      // force key-buffer on here -- __focusClip enables it only for a terminal
      // pane, since a focused note routes keys to its textarea instead.
      if (m === 'navigate') {
        keybuf.setAttribute('enabled', 'false');
        if (document.activeElement?.classList.contains('note-edit')) document.activeElement.blur();
      }
      renderBindings(m);
    }
    setMode('navigate');

    // Keyboard-driven picker panels (the top New-clip picker and the bottom
    // clip-actions panel). Each panel node is static (toggled by a data-show
    // signal), so we patch the capture-phase key handler in and out on that
    // signal's edge (__sync*, called from a data-effect). While open it owns
    // every key -- Ctrl-n/Ctrl-p or Down/Up move, Enter chooses, Esc closes --
    // and swallows the rest so nothing leaks to a focused terminal's
    // key-buffer. Selection is a .sel class on the rows (no signal), the way
    // the stacks.nu action panel does it. Row queries are scoped to panelSel
    // so the two panels' rows never cross-match. Returns a sync(on) callback.
    function makePicker(panelSel, signal) {
      let keyHandler = null;
      const rows = () => Array.from((document.querySelector(panelSel) || document).querySelectorAll('.picker-row'));
      const selIdx = () => rows().findIndex((r) => r.classList.contains('sel'));
      function setSel(i) {
        const rs = rows();
        if (!rs.length) return;
        const w = ((i % rs.length) + rs.length) % rs.length;
        rs.forEach((r) => r.classList.remove('sel'));
        rs[w].classList.add('sel');
      }
      // Mouse and keyboard share one .sel highlight. Rows are static (the
      // panels live in the shell, never morphed), so wire hover once.
      rows().forEach((r, i) => r.addEventListener('mouseenter', () => setSel(i)));
      function open() {
        if (keyHandler) return;
        setSel(0);
        keyHandler = (e) => {
          const k = e.key;
          if (k === 'Shift' || k === 'Control' || k === 'Alt' || k === 'Meta') return;
          if (k === 'Escape') mergePatch({ [signal]: false });
          else if (k === 'Enter') (rows()[selIdx()] || rows()[0])?.click();
          else if (k === 'ArrowDown' || (e.ctrlKey && k === 'n')) setSel(selIdx() + 1);
          else if (k === 'ArrowUp' || (e.ctrlKey && k === 'p')) setSel(selIdx() - 1);
          // Modal owns every key while open: stop here so nothing reaches the
          // global keymap or the focused terminal's key-buffer.
          e.preventDefault();
          e.stopImmediatePropagation();
        };
        document.addEventListener('keydown', keyHandler, { capture: true });
      }
      function close() {
        if (!keyHandler) return;
        document.removeEventListener('keydown', keyHandler, { capture: true });
        keyHandler = null;
      }
      return (on) => (on ? open() : close());
    }
    window.__syncPicker = makePicker('.picker-panel', 'picking');
    window.__syncActions = makePicker('.actions-panel', 'acting');

    // Focus a clip by id -- the one entry point for "go into this pane".
    // Terminal: point key-buffer at the pane's pty (its .pane-screen carries
    // data-sid), enable it, and enter focus mode so typing lands immediately.
    // Note: focusing a note IS editing it -- show the textarea, silence
    // key-buffer (the textarea owns keys), focus it, and still enter focus
    // mode so Alt+J/K carries on to the next pane and mod+Enter leaves.
    window.__focusClip = (cid) => {
      if (!cid) return;
      const pane = doc.querySelector('#pane-' + CSS.escape(cid));
      if (!pane) return;
      // Notes branch by data-render, not data-kind: a note clip's kind is
      // 'content' (only 'content' and 'terminal' exist), and data-render
      // is what scanPanes uses for wiring too (the 'note' value means
      // "editable textarea"). Mismatching this against 'kind' meant clicks
      // on notes never opened the editor and typing did nothing.
      if (pane.dataset.render === 'note') {
        keybuf.setAttribute('enabled', 'false');
        const ta = pane.querySelector('.note-edit'), pre = pane.querySelector('.note-pre');
        // Only seed + focus on fresh entry. The selection signal re-fires
        // __focusClip on every live clip.update; reseeding the textarea then
        // would drop an in-flight draft and jump the caret. The editor is
        // data-ignore-morph, so its own content lags the backend -- reseed it
        // from the live <pre> when first opening it. $noteEditing is set by the
        // textarea's focus handler (it fires after any prior editor's blur, so
        // it resolves to the clip being entered, and hides this <pre> reactively
        // via data-show). The textarea is morph-immune, so a plain inline
        // display toggle here is safe.
        if (ta && document.activeElement !== ta) {
          if (pre) ta.value = pre.textContent;
          ta.style.display = '';
          ta.focus();
          // Land the caret at the end so you continue the note where it left
          // off rather than at the top.
          ta.setSelectionRange(ta.value.length, ta.value.length);
          growNote(ta);
        }
        setMode('focus');
        return;
      }
      const sid = pane.querySelector('.pane-screen')?.dataset.sid;
      if (!sid) return;
      keybuf.setAttribute('sid', sid);
      keybuf.setAttribute('enabled', 'true');
      setMode('focus');
    };

    // Clicking truly outside a pane (topbar, canvas, empty doc area) drops
    // back to navigate mode. Exempt surfaces: a pane (its own handler focuses
    // it), the sidebar (selecting a clip carries focus, like Alt+J/K -- and
    // cycle() drives selection via a synthetic sidebar click), the rename
    // modal/picker (keeps their inputs working), and the status bar.
    document.addEventListener('click', (e) => {
      if (e.target.closest('.pane') || e.target.closest('#clips-list') || e.target.closest('#stacks-list') ||
          e.target.closest('.modal-backdrop') || e.target.closest('.statusbar')) return;
      if (mode === 'focus') setMode('navigate');
    });

    // Combo normalization. macOS substitutes a glyph for e.key when Alt is
    // held (option+d -> the partial-derivative sign); fall back to e.code
    // (KeyD -> "d") so alt+letter combos still match.
    function comboKey(e) {
      const parts = [];
      if (e.metaKey) parts.push('cmd');
      if (e.ctrlKey) parts.push('ctrl');
      if (e.altKey) parts.push('alt');
      if (e.shiftKey) parts.push('shift');
      let k = e.key;
      if (e.altKey && e.code && e.code.startsWith('Key')) {
        k = e.code.slice(3).toLowerCase();
      } else if (k.length === 1 && /[a-zA-Z]/.test(k)) {
        k = k.toLowerCase();
      } else if (k === ' ') {
        k = 'space';
      }
      parts.push(k.toLowerCase());
      return parts.join('+');
    }
    function readJson(name) {
      const raw = document.body.dataset[name];
      if (!raw) return {};
      try { return JSON.parse(raw); } catch { return {}; }
    }
    // Capture-phase keymap. A matched combo calls stopPropagation so it never
    // reaches key-buffer's window (bubble-phase) listener. App chords are
    // Alt-prefixed (ADR 0004) and fire in EVERY mode -- navigate, a focused
    // terminal, or while editing a note -- so clip management (Alt+T/D/J/K/R/O)
    // never requires leaving what you're in. Non-Alt keys are context-scoped:
    //   editing a note -- the textarea owns them (Enter = newline, Escape ends
    //                      the edit by blurring; the blur handler renders the
    //                      <pre> and persists).
    //   focused terminal -- everything (plain Esc and Enter included) goes to
    //                        the pty; mod+Enter is the only exit.
    //   navigate         -- no non-Alt bindings today (mod+Enter focuses).
    // The modal-input guard keeps the rename field's own Enter/Esc/typing.
    function runAction(id) {
      const js = readJson('actions')[id];
      if (!js) return;
      try { new Function(js)(); } catch (err) { console.error('action', id, err); }
    }
    document.addEventListener('keydown', (e) => {
      if (document.activeElement?.classList.contains('modal-input')) return;
      const combo = comboKey(e);
      const editingNote = document.activeElement?.classList.contains('note-edit');

      // mod+Enter: the only focus toggle, in any mode (Cmd on macOS, Ctrl else
      // -- both mapped). key-buffer drops Meta combos and a plain terminal
      // can't tell Ctrl+Enter from Enter, so intercepting it costs the pty
      // nothing. While editing a note this commits and leaves (setMode blurs
      // -> saves). Plain Esc and Enter are left entirely to the focused pty.
      if (combo === 'cmd+enter' || combo === 'ctrl+enter') {
        e.preventDefault();
        e.stopPropagation();
        window.app.toggleFocus();
        return;
      }
      // mod+K opens the clip-actions panel on the current clip. Cmd+K works in
      // every mode, including a focused terminal -- key-buffer drops Meta combos,
      // so the pty never loses anything. Ctrl+K only opens in navigate mode, so
      // a focused terminal keeps Ctrl+K as readline kill-line on every platform.
      // preventDefault suppresses the browser's own Cmd/Ctrl+K (omnibox search).
      if (combo === 'cmd+k' || (combo === 'ctrl+k' && mode === 'navigate')) {
        e.preventDefault();
        e.stopPropagation();
        window.app.openActions();
        return;
      }
      // Alt app-chords: active in every mode. Save a note being edited first
      // (blur renders the <pre> and persists) so Alt+J/K leaves it clean.
      const altId = e.altKey ? readJson('keymap')[combo] : null;
      if (altId) {
        e.preventDefault();
        e.stopPropagation();
        if (editingNote) document.activeElement.blur();
        runAction(altId);
        return;
      }
      // Non-Alt keys from here.
      if (editingNote) {
        if (e.key === 'Escape') {
          e.preventDefault();
          document.activeElement.blur();
        }
        return; // textarea owns the rest, including Enter for a newline
      }
      if (mode === 'focus') return; // focused terminal: pty owns everything
      const id = readJson('keymap')[combo]; // navigate: any non-Alt binding
      if (!id) return;
      e.preventDefault();
      e.stopPropagation();
      runAction(id);
    }, { capture: true });
  </script>
</body>
</html>
