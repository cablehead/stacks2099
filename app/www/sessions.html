<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8">
    <title>{{ title or "ghostty-web-nu sessions" }}</title>
    <script type="module" src="{{ datastar_js_path }}"></script>
    <script type="module" src="/key-buffer.js"></script>
    <link rel="stylesheet" href="/stellar.css">
    <link rel="stylesheet" href="/md.css">
    <link rel="stylesheet" href="/grid.css">
    <style>
      :root {
        --bg: #1d0e2e;
        --fg: #d4d4d4;
        --pane: #161616;
        --pane-border: #2a2a2a;
        --sel: #2a9d4a;
        --sel-blur: #2d4f7c;
        --sel-fg: #ffffff;
        --dim: #888;
        --chrome: #252525;
        /* Height of the bottom status bar. The bottom-anchored modals (clip
           actions, new-clip picker) rest their bottom edge on top of it, so they
           look like they grow out of the bar. Single source so they can't drift
           apart. */
        --statusbar-h: 1.7rem;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 14px var(--term-font);
      }
      /* Top row holds stacks | clips | main; the bottom row is the status bar
         spanning all three columns (full window width). */
      body {
        display: grid;
        grid-template-columns: 14rem 16rem 1fr;
        grid-template-rows: 1fr auto;
        height: 100dvh;
      }
      /* niri reclaims the screen: collapse the stacks + clips rails so the strip
         gets the full width. Navigation is j/k + the panning strip; mod+K l
         restores flow (and the rails). */
      body.nav-collapsed {
        grid-template-columns: 0 0 1fr;
      }
      body.nav-collapsed > #stacks-list, body.nav-collapsed > #clips-list {
        overflow: hidden;
      }
      aside {
        background: var(--pane);
        border-right: 1px solid var(--pane-border);
        overflow-y: auto;
        min-height: 0;
      }
      aside header {
        padding: 0.4rem 0.5rem 0.4rem 0.75rem;
        border-bottom: 1px solid var(--pane-border);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--dim);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      aside header .new-btn {
        background: transparent;
        color: inherit;
        border: 1px solid var(--pane-border);
        border-radius: 3px;
        padding: 0 0.5rem;
        font: inherit;
        cursor: pointer;
        line-height: 1.4;
      }
      aside header .sort-btn {
        margin-left: auto;
        margin-right: 0.4rem;
        background: transparent;
        color: var(--dim);
        border: 1px solid var(--pane-border);
        border-radius: 3px;
        padding: 0 0.4rem;
        font: inherit;
        font-size: 11px;
        line-height: 1.4;
        text-transform: none;
        cursor: pointer;
      }
      aside header .sort-btn:hover {
        background: #222;
        color: var(--fg);
      }
      aside header .new-btn:hover {
        background: #222;
        color: var(--fg);
      }
      aside ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      aside li {
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid var(--pane-border);
      }
      aside li .row {
        flex: 1;
        min-width: 0;
        text-align: left;
        background: transparent;
        color: inherit;
        border: 0;
        padding: 0.4rem 0.75rem;
        font: inherit;
        cursor: pointer;
        overflow: hidden;
      }
      aside li .row:hover {
        background: #222;
      }
      /* Selected tab is blue while merely selected (navigate mode) and green
         once a terminal is focused -- mirrors the focused/blurred distinction. */
      aside li.selected .row {
        background: var(--sel-blur);
        color: var(--sel-fg);
      }
      body.mode-focus aside li.selected .row {
        background: var(--sel);
      }
      aside li .close {
        flex: 0 0 auto;
        width: 1.75rem;
        background: transparent;
        color: inherit;
        border: 0;
        padding: 0;
        font: inherit;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.1s;
      }
      aside li:hover .close, aside li.selected .close {
        opacity: 0.6;
      }
      aside li .close:hover {
        opacity: 1;
        color: #ff7676;
        background: #222;
      }
      aside li .copy {
        flex: 0 0 auto;
        width: 1.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: inherit;
        border: 0;
        padding: 0;
        font: inherit;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.1s;
      }
      aside li:hover .copy, aside li.selected .copy {
        opacity: 0.6;
      }
      aside li .copy:hover {
        opacity: 1;
        background: #222;
      }
      aside li .copy.copied {
        opacity: 1;
        color: var(--sel);
      }
      aside li small {
        display: block;
        font-size: 11px;
        opacity: 0.6;
      }
      /* Inline SVG icons (vendored lucide). Size to the text, nudge to the
         baseline, and leave a little space before the label. */
      .row-icon, .picker-row .icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        margin-right: 0.5ch;
        flex: 0 0 auto;
      }
      /* main is a grid: topbar | doc. The status bar lives at body level now. */
      main {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        overflow: hidden;
      }
      /* Shared chrome for the three bars (top bar, per-clip header, status bar):
         same background, padding, and font so they read as one family. Each adds
         its own layout (flex spacers, per-pane gap) on top. */
      .bar {
        background: var(--chrome);
        padding: 0.15rem 0.6rem;
        font-size: 11px;
        color: var(--dim);
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .title-display {
        background: transparent;
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
        padding: 0.1rem 0.4rem;
        border-radius: 3px;
        max-width: 44ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .title-display:hover {
        background: #2f2f2f;
        color: var(--fg);
      }
      .topbar-spacer {
        flex: 1;
      }
      /* Shared affordance chip for the top + status bars: advertises a key and,
         on click, runs the same action the key would. Replaces the old flat
         wall of binding chips -- actions now live on the top bar (New / Sort /
         Layout) and in the clip-actions panel. */
      .bar-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4ch;
        background: transparent;
        color: var(--dim);
        border: 1px solid transparent;
        border-radius: 3px;
        padding: 0.1rem 0.45rem;
        font: inherit;
        font-size: 11px;
        line-height: 1.5;
        cursor: pointer;
      }
      .bar-btn:hover {
        background: #222;
        color: var(--fg);
      }
      .bar-btn .icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
      }
      /* The primary affordance (New): outlined so it reads as the main entry. */
      .bar-btn-primary {
        color: var(--fg);
        border-color: var(--pane-border);
      }
      .bar-btn-primary:hover {
        background: var(--sel-blur);
        border-color: var(--sel-blur);
        color: var(--sel-fg);
      }
      .bar-btn kbd, .mode-hint kbd, .row-keys kbd {
        font-family: var(--term-font);
        font-size: 10px;
        background: #1c1c1c;
        border: 1px solid var(--pane-border);
        border-radius: 3px;
        padding: 0 0.35ch;
        line-height: 1.4;
        color: var(--dim);
      }
      .middle {
        display: grid;
        grid-template-columns: 1fr 1ch;
        min-height: 0;
      }
      /* Continuous document: every session's terminal stacked vertically, the
         whole column scrolls. Each .pane is a fixed-height live terminal whose
         grid.css #screen-<sid> fills the .pane-screen below its header. */
      #doc {
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      /* niri layout: the document becomes a horizontal scrollable strip -- each
         pane a fixed-width (100ch) full-height column you pan across, rather than a
         stacked row. Same panes (live grids intact), only the container axis flips. */
      #doc.layout-niri {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        align-items: stretch;
      }
      #doc.layout-niri .pane {
        flex: 0 0 100ch;
        width: 100ch;
        overflow-y: auto;
      }
      .pane {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--pane-border);
        border-radius: 4px;
        overflow: hidden;
        background: var(--term-bg);
        transition: opacity 0.12s, border-color 0.12s;
        scroll-margin: 0.5rem;
      }
      .pane-head {
        flex: 0 0 auto;
        cursor: pointer;
        display: flex;
        gap: 0.5ch;
        align-items: baseline;
      }
      .pane-head small {
        font-size: 11px;
        opacity: 0.5;
      }
      /* Morph HUD: rows touched by the last /pty/view patch. Pushed to the right
         end of the head so it doesn't crowd the label; tabular-nums keeps it
         from jittering as the digit count changes. */
      .pane-head .grid-hud {
        margin-left: auto;
        opacity: 0.55;
        font-variant-numeric: tabular-nums;
      }
      /* The terminal viewport. terminal.js sets its height to the row count it
         wants (fixedRows * cell height), so the pane sizes itself -- no calc,
         no absolute positioning. Scrollback scrolls within this box. */
      .pane-screen {
        flex: 0 0 auto;
        overflow-y: auto;
        overflow-x: hidden;
        background: var(--term-bg);
      }
      /* Note panes: a <pre> for display, swapped for a <textarea> while editing.
         Both share the terminal font and the pane background (no white box, no
         border) so editing blends into the surface. The editor fills the pane
         width and grows with its content (JS sets height from scrollHeight),
         with a few-row floor so a new note has room. */
      .note-body {
        background: var(--term-bg);
      }
      .note-pre, .note-edit {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 0.25rem 0.6rem;
        background: var(--term-bg);
        color: var(--term-fg);
        font-family: var(--term-font);
        font-size: 14px;
        line-height: var(--cell-h);
        white-space: pre-wrap;
        word-break: break-word;
        min-height: calc(var(--cell-h) * 3);
      }
      .note-edit {
        border: 0;
        outline: none;
        resize: none;
        overflow: hidden;
      }
      /* Content previews: images, read-only text, file links. */
      .clip-media {
        padding: 0.4rem 0.6rem;
        background: var(--term-bg);
      }
      .clip-img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 3px;
      }
      .clip-file {
        color: var(--sel-fg);
      }
      .clip-pre {
        margin: 0;
        padding: 0.25rem 0.6rem;
        background: var(--term-bg);
        color: var(--term-fg);
        font-family: var(--term-font);
        font-size: 14px;
        line-height: var(--cell-h);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 30rem;
        overflow: auto;
      }
      /* Embed (live iframe) clips. */
      .clip-embed-wrap {
        display: flex;
        flex-direction: column;
        background: var(--term-bg);
      }
      .embed-bar {
        display: flex;
        gap: 0.5ch;
        align-items: center;
        padding: 0.2rem 0.5rem;
        font-size: 11px;
        color: var(--dim);
        border-bottom: 1px solid var(--pane-border);
      }
      .embed-url {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--dim);
        text-decoration: none;
      }
      .embed-url:hover {
        color: var(--fg);
      }
      .clip-embed {
        width: 100%;
        height: 40rem;
        border: 0;
        background: #fff;
      }
      .mini-btn {
        background: transparent;
        color: var(--dim);
        border: 1px solid var(--pane-border);
        border-radius: 3px;
        padding: 0 0.5ch;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .mini-btn:hover {
        background: #222;
        color: var(--fg);
      }
      /* The active (selected) pane is highlighted. In navigate mode every pane
         is dimmed (read-only); focus mode lights the active one fully. */
      .pane.active {
        border-color: var(--sel-blur);
      }
      body.mode-focus .pane.active {
        border-color: var(--sel);
      }
      body.mode-navigate .pane {
        opacity: 0.3;
      }
      body.mode-navigate .pane.active {
        opacity: 0.55;
      }
      body.mode-focus .pane {
        opacity: 0.4;
      }
      body.mode-focus .pane.active {
        opacity: 1;
      }
      .mode-badge {
        margin-left: auto;
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      body.mode-focus .mode-badge {
        color: var(--sel);
      }
      .rightbar {
        background: var(--chrome);
      }
      .statusbar {
        grid-column: 1 / -1; /* span stacks + clips + main */
        box-sizing: border-box;
        height: var(--statusbar-h);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 1rem; /* wider horizontal than .bar; full-window */
        color: var(--fg); /* brighter than the bar default */
        border-top: 1px solid var(--pane-border);
        line-height: 1;
        font-family: var(--term-font);
      }
      .status-keys {
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      .status-mode {
        background: transparent;
        border: 0;
        font: inherit;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--dim);
        padding: 0.1rem 0.4rem;
        border-radius: 3px;
      }
      .status-mode:hover {
        background: #222;
        color: var(--fg);
      }
      body.mode-focus .status-mode {
        color: var(--sel);
      }
      .mode-hint {
        display: inline-flex;
        gap: 0.2ch;
        opacity: 0.55;
      }
      .status-meta {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      /* Trailing key-hint cluster pushed to the right of a clip-actions row. */
      .row-keys {
        margin-left: auto;
        display: inline-flex;
        gap: 0.2ch;
        opacity: 0.8;
      }

      /* Rename modal. */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 6rem;
      }
      .modal-box {
        width: min(28rem, 90%);
        background: var(--pane);
        border: 1px solid var(--pane-border);
        border-radius: 4px;
        padding: 0.75rem 1rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .modal-heading {
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 0.35rem;
      }
      .modal-input {
        width: 100%;
        background: transparent;
        border: 0;
        outline: none;
        color: var(--fg);
        font: inherit;
        font-size: 14px;
        padding: 0.25rem 0;
      }

      /* New-clip picker. Rises out of the bottom status bar (bottom-right), the
         same place and shape as the clip-actions panel -- it replaces that modal
         rather than dropping from the top. */
      .picker-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0 0.75rem var(--statusbar-h) 0;
        background: transparent;
      }
      /* Theme picker drops from the top bar (top-right). */
      .theme-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        padding: 1.5rem 0.75rem 0 0;
        background: transparent;
      }
      /* Stacks switcher drops from the top-left breadcrumb instead. */
      .stack-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 1.5rem 0 0 0.5rem;
        background: transparent;
      }
      .theme-panel, .stack-panel {
        min-width: 13rem;
        background: var(--chrome);
        border: 1px solid var(--pane-border);
        border-top: 0;
        border-radius: 0 0 5px 5px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      /* New-clip picker rises from the status bar: round the top, shadow up. */
      .picker-panel {
        min-width: 13rem;
        background: var(--chrome);
        border: 1px solid var(--pane-border);
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
        box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      /* Breadcrumb sits a touch brighter than the other bar chips -- it's context,
         not an action; ellipsize a long stack name. */
      .stack-crumb {
        color: var(--fg);
        max-width: 22ch;
        overflow: hidden;
      }
      .stack-crumb span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .picker-heading {
        padding: 0.3rem 0.75rem;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid var(--pane-border);
      }
      .picker-row {
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--fg);
        border: 0;
        padding: 0.4rem 0.75rem;
        font: inherit;
        cursor: pointer;
      }
      /* Keyboard (.sel) and mouse (:hover) share one highlight. */
      .picker-row:hover, .picker-row.sel {
        background: var(--sel-blur);
        color: var(--sel-fg);
      }
      /* The currently-applied theme: a trailing check. */
      .picker-row.active {
        color: var(--sel);
      }
      .picker-row.active::after {
        content: "\2713";
        margin-left: auto;
      }

      /* Clip-actions panel. Acts on the current clip, so it rises out of the
         bottom-right status bar (rounded top corners, shadow upward) -- the
         mirror of the top New picker. Reuses .picker-row / .picker-heading. */
      .actions-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0 0.75rem var(--statusbar-h) 0;
        background: transparent;
      }
      .actions-panel {
        min-width: 13rem;
        background: var(--chrome);
        border: 1px solid var(--pane-border);
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
        box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
    </style>
  </head>
  <body
    data-signals='{"cursor":"","selectedStack":{{ stack_id | default("") | tojson | e }},"connId":"","termCols":0,"termRows":0,"termTitle":"","focusedDims":"","title":{{ title | default("") | tojson | e }},"docReady":false,"picking":false,"acting":false,"themePicking":false,"theme":"default","stackPicking":false,"stackName":"","renaming":false,"renameMode":"title","renameStackId":"","draft":"","label":"","noteEditing":"","docOrder":"[]","docLayout":"flow"}'
    data-attr:data-theme="$theme"
    data-init="@get('/sse?stack=' + encodeURIComponent($selectedStack))"
    data-effect="document.title = $title || 'ghostty-web-nu sessions'"
    data-class:nav-collapsed="$docLayout === 'niri'"
    data-actions='{
    "next":      "window.app.cycle(1)",
    "prev":      "window.app.cycle(-1)",
    "moveDown":  "window.app.move(\"down\")",
    "moveUp":    "window.app.move(\"up\")"
  }'
    data-keymap='{
    "j": "next",
    "k": "prev",
    "shift+j": "moveDown",
    "shift+k": "moveUp"
  }'
  >
    <!-- Three-pane: stacks | clips | content (#doc). Server overwrites the two
       asides on every event. -->
    <aside id="stacks-list"><header>Stacks</header></aside>
    <aside id="clips-list"><header>Clips</header></aside>

    <main>
      <!-- Top bar: cross-clip + context. Stack breadcrumb + window title on the
         left; stack-level toggles and the New-clip entry on the right. The
         breadcrumb shows the current stack (gone from the rail in niri) and is
         the visible handle for the top-left Stacks switcher. New is the handle
         for the top-right picker. -->
      <div class="bar topbar">
        <button
          class="bar-btn stack-crumb"
          type="button"
          title="Switch stack (mod+K g; cycle mod+K [ / ])"
          data-on:click="$stackPicking = true"
        >
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"
            />
            <path
              d="m6.08 9.5-3.49 1.59a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.49-1.59"
            />
          </svg>
          <span data-text="$stackName || 'stack'"></span>
        </button>
        <button
          class="title-display"
          type="button"
          title="Rename window"
          data-text="$title || 'untitled'"
          data-on:click="$draft = $title; $renameMode = 'title'; $renaming = true"
        >
        </button>
        <span class="topbar-spacer"></span>
        <button
          class="bar-btn"
          type="button"
          title="Theme"
          aria-label="Theme"
          data-on:click="$themePicking = true"
        >
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"

    <!-- Scroll the active pane into view (stacks-style offset) whenever the
       selection changes. Lives in the static shell so the server never
       morphs it away; data-effect fires on $cursor change. -->
    <!-- Lead with a bare $cursor read so Datastar registers it as a
       dependency even on the first eval, when the deferred module hasn't
       defined window.__onSelect yet (a `&&` guard would short-circuit
       before $cursor is read, and the effect would never re-run). -->

      data-effect="$cursor; window.__onSelect && window.__onSelect($cursor)"
      style="display: none"

       can target the current stack when adding an image clip. -->

      style="display: none"
    >
    </div>
    <!-- Layout flip: resize terminals to fill (niri) or constant rows (flow).
       Lead with a bare $docLayout read so datastar registers it as a dependency
       on first eval (the `&&` would short-circuit before re-reading it). -->
    <div
      data-effect="$docLayout; window.__applyLayout && window.__applyLayout($docLayout)"
      style="display: none"
    >

       picker node is static (toggled by data-show), so this stands in for the
       morph-driven mount/self-clean that an action panel gets for free. Lead
       with a bare $picking read so datastar registers the dependency even
       before the deferred module defines __syncPicker. -->

      // mergePatch lets imperative code (focus/blur of the note editor) drive the

      // Capture-phase keymap. A matched combo calls stopPropagation so it never
      // reaches key-buffer's window (bubble-phase) listener. App chords are
      // Alt-prefixed (ADR 0004) and fire in EVERY mode -- navigate, a focused
      // terminal, or while editing a note -- so clip management (Alt+T/D/J/K/R/O)
      // never requires leaving what you're in. Non-Alt keys are context-scoped:
      //   editing a note -- the textarea owns them (Enter = newline, Escape ends
      //                      the edit by blurring; the blur handler renders the
      //                      <pre> and persists).
      //   focused terminal -- everything (plain Esc and Enter included) goes to
      //                        the pty; mod+Enter is the only exit.
      //   navigate         -- no non-Alt bindings today (mod+Enter focuses).
      // The modal-input guard keeps the rename field's own Enter/Esc/typing.
      function runAction(id) {
        const js = readJson("actions")[id];
        if (!js) return;
        try {
          new Function(js)();
        } catch (err) {
          console.error("action", id, err);
        }
      }

      // mod+K clip-actions modal (ADR 0008). mod+K is the one key safe to pierce
      // a focused clip (Meta -- key-buffer drops it before the pty). It makes the
      // modal OWN the keyboard immediately and continuously, until an action runs
      // or it is dismissed. The panel is a delayed *visual* of that ownership: a
      // show-timer paints it after LEADER_HINT_MS, but key handling is identical
      // whether or not it has painted (a deliberate mod+K r fires before the
      // panel ever shows). The keymap is the panel's rows (data-key) plus j/k
      // navigation -- one set, read live, no second makePicker handler.
      const ACTIONS_HINT_MS = 150;
      let actionsOwned = false; // modal owns the keyboard
      let actionsTimer = null; // panel show-timer
      function actionsActive() {
        return actionsOwned;
      }
      function preselectActionsRow() {
        // Put the .sel cursor on the first row when the panel paints, so Enter
        // has a target and the cursor is visible. Arrows / ctrl-n-p move it.
        const rows = [
          ...document.querySelectorAll(".actions-panel .picker-row"),
        ];
        rows.forEach((r, i) => r.classList.toggle("sel", i === 0));
      }
      function openActionsOwn() {
        actionsOwned = true;
        // Paint the panel only if the user pauses; a fast mod+K r never flashes
        // it. Ownership does not depend on the panel being visible.
        if (actionsTimer === null) {
          actionsTimer = setTimeout(() => {
            actionsTimer = null;
            if (actionsOwned) {
              mergePatch({ acting: true });
              preselectActionsRow();
            }
          }, ACTIONS_HINT_MS);
        }
      }
      function endActions() {
        actionsOwned = false;
        if (actionsTimer !== null) clearTimeout(actionsTimer);
        actionsTimer = null;
        mergePatch({ acting: false });
      }
      // Run the panel action bound to `key` (its data-key row). Returns true if a
      // row matched. Clicking the row runs its data-on:click (which also sets
      // $acting=false); we still endActions() to release ownership + the timer.
      function runActionKey(key) {
        const row = document.querySelector(
          `.actions-panel [data-key="${key}"]`,
        );
        if (!row) return false;
        endActions();
        row.click();
        return true;
      }
      // Move the .sel highlight among the panel rows (arrows / ctrl-n/p). Pure
      // navigation -- invokes nothing, keeps ownership.
      function moveActionsSel(dir) {
        const rows = [
          ...document.querySelectorAll(".actions-panel .picker-row"),
        ];
        if (!rows.length) return;
        const i = rows.findIndex((r) => r.classList.contains("sel"));
        const n = ((i < 0 ? 0 : i) + dir + rows.length) % rows.length;
        rows.forEach((r) => r.classList.remove("sel"));
        rows[n].classList.add("sel");
        rows[n].scrollIntoView({ block: "nearest" });
      }
      document.addEventListener("keydown", (e) => {
        if (document.activeElement?.classList.contains("modal-input")) {
          return;
        }
        const combo = comboKey(e);
        const editingNote = document.activeElement?.classList.contains(
          "note-edit",
        );

        // The clip-actions modal owns the keyboard (ADR 0008). From the mod+K
        // press until an action runs or it is dismissed, every key routes here --
        // the same whether or not the panel has painted yet.
        if (actionsActive()) {
          const k = e.key;
          // A bare modifier press isn't a command; keep ownership, keep waiting.
          if (["Shift", "Control", "Alt", "Meta", "CapsLock"].includes(k)) {
            return;
          }
          e.preventDefault();
          e.stopPropagation();
          // mod+K again dismisses (prefix-prefix closes), like tmux's leader.
          if (combo === "cmd+k" || combo === "ctrl+k") {
            endActions();
            return;
          }
          // In-menu navigation invokes nothing, so it keeps ownership.
          if (k === "ArrowDown" || (e.ctrlKey && k === "n")) {
            moveActionsSel(1);
          } else if (k === "ArrowUp" || (e.ctrlKey && k === "p")) {
            moveActionsSel(-1);
          } else if (k === "Enter") {
            const sel = document.querySelector(
              ".actions-panel .picker-row.sel",
            );
            endActions();
            (sel || document.querySelector(".actions-panel .picker-row"))
              ?.click();
          } else if (k === "Escape") {
            endActions(); // dismiss, no action
          } else if (!runActionKey(k)) {
            // Unbound key: swallowed (the modal owns the keyboard).
          }
          return;
        }

        // mod+Enter: the only focus toggle, in any mode (Cmd on macOS, Ctrl else
        // -- both mapped). key-buffer drops Meta combos and a plain terminal
        // can't tell Ctrl+Enter from Enter, so intercepting it costs the pty
        // nothing. While editing a note this commits and leaves (setMode blurs
        // -> saves). Plain Esc and Enter are left entirely to the focused pty.
        if (combo === "cmd+enter" || combo === "ctrl+enter") {
          e.preventDefault();
          e.stopPropagation();
          window.app.toggleFocus();
          return;
        }
        // mod+K is the leader (ADR 0007): start the pending state and the hint
        // timer instead of opening the panel immediately. mod+K then j/k/r/d/...
        // runs a clip command; pausing opens the panel as the cheatsheet. Cmd+K
        // works in every mode, including a focused terminal -- key-buffer drops
        // Meta combos, so the pty never loses anything. Ctrl+K only leads in
        // navigate mode, so a focused terminal keeps Ctrl+K as readline
        // kill-line. preventDefault suppresses the browser's own Cmd/Ctrl+K.
        if (
          combo === "cmd+k" ||
          (combo === "ctrl+k" && mode === "navigate")
        ) {
          e.preventDefault();
          e.stopPropagation();
          openActionsOwn();
          return;
        }
        // A focused clip owns every other key (ADR 0005). mod+Enter and mod+K
        // above are the only carve-outs; from here the keystroke reaches the
        // focused clip untouched -- a note's textarea handles it (Escape ends the
        // edit), a terminal's pty gets it raw via key-buffer. Intercepting nothing
        // else is what lets Option/AltGr-composed characters (|, ~, \) through.
        if (editingNote) {
          if (e.key === "Escape") {
            e.preventDefault();
            document.activeElement.blur();
          }
          return; // textarea owns the rest, including Enter for a newline
        }
        if (mode === "focus") return; // focused terminal: pty owns everything
        // Navigate mode: plain Enter focuses the selected clip (mod+Enter also
        // works, in any mode). Safe here -- a focused pty owns Enter via the
        // return above, and a note's textarea owns it via the editingNote
        // branch, so this only fires while browsing.
        if (e.key === "Enter" && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          e.stopPropagation();
          window.app.toggleFocus();
          return;
        }
        // The app keymap owns the rest (Alt chords + bare j/k bindings).
        const id = readJson("keymap")[combo];
        if (!id) return;
        e.preventDefault();
        e.stopPropagation();
        runAction(id);
      }, { capture: true });
    </script>
  </body>
</html>
